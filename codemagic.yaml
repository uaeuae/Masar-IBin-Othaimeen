# iOS builds without a Mac: Codemagic (free tier: 500 macOS build minutes/month).
#
# One-time setup: DONE 2026-07-27. Apple Developer enrolled, ASC API key
# created (App Manager role), Codemagic integration named masar-asc-key,
# bundle id app.masar.talib registered, App Store Connect app record created
# (app id 6795260984). Nothing here needs redoing.
#
# Builds are AUTOMATIC since 2026-07-29: every push to main that touches app/
# builds and uploads to TestFlight (see `triggering` below). Put [skip ci] in
# the commit message to suppress one, or start a build by hand from the
# Codemagic UI as before.
#
# Monorepo note: this file MUST stay at the repository root (Codemagic only
# looks for codemagic.yaml there); `working_directory: app` is what targets
# the Flutter app. Codemagic's onboarding scanner will still complain that the
# root has no mobile app -- ignore it, or set Project path to `app`, it does
# not affect the yaml build.
#
# To add a tester: App Store Connect → TestFlight → Internal Testing. Internal
# testers skip Beta App Review; external testers do not.
#
# Known flaky failure, seen 2026-07-29 -- the build uploads, then:
#   GET /v1/builds/<id>/buildBetaDetail returned 404:
#   There is no resource of type 'buildBetaDetails'
# Apple creates the `builds` record before the `buildBetaDetails` relationship
# exists, and the CLI treats that gap as fatal instead of retrying. It is
# transient and NOT a signing or key problem -- the binary is already in App
# Store Connect when it happens. Recovery: assign that build to the Masar group
# by hand in TestFlight (no rebuild), or just re-run the workflow;
# PROJECT_BUILD_NUMBER increments, so there is no version clash with the upload
# that already landed.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    # Every push to main ships a TestFlight build. Requires the webhook to
    # exist on the Codemagic side -- apps connected via the GitHub App get one
    # automatically; otherwise copy the URL from the app's settings into
    # GitHub → Settings → Webhooks. The yaml alone will not trigger anything.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # Pushing three commits in a row should produce one build, not three --
      # the free tier is 500 macOS minutes/month and a build costs ~20.
      cancel_previous_builds: true
    # Skip the build entirely when a push touched nothing the app is made of.
    # Editing DECISIONS.md must not cost a TestFlight build.
    when:
      changeset:
        includes:
          - 'app'
          - 'codemagic.yaml'
        excludes:
          - '**/*.md'
    environment:
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      # Still needed: the TestFlight upload at the bottom authenticates with
      # these. Signing itself no longer touches the Apple API at all.
      groups:
        - appstore_credentials
      # Reference two identities already uploaded under Code signing
      # identities, rather than asking Codemagic to go find or create signing
      # files at build time -- every attempt at that silently provisioned
      # nothing and left the archive with no identity to sign with.
      #   codemagic     -- Apple Distribution cert Codemagic generated, so it
      #                    holds the private key (Apple id GPHQM2X78V)
      #   masar_profile -- app_store profile for app.masar.talib, bound to it
      ios_signing:
        provisioning_profiles:
          - masar_profile
        certificates:
          - codemagic
      vars:
        BUNDLE_ID: app.masar.talib
    working_directory: app
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Set up code signing
        script: |
          set -e
          # Codemagic has already put the referenced cert in the keychain and
          # the profile on disk by this point; this only wires them into the
          # Xcode project.
          xcode-project use-profiles
          # Guard: find-identity EXITS 0 even when it finds nothing, so grep
          # for a real identity or the build stops here instead of failing
          # later with a misleading "no development certificates" message.
          security find-identity -v -p codesigning | grep -q "Apple Distribution"
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Distribute to the INTERNAL group. Without naming a group the build is
        # pushed at external beta review, which needs Beta App Information and
        # a review contact and fails the build without them. Internal testers
        # skip review entirely -- add external testers only when the app is
        # ready for strangers, and fill in the test info at that point.
        beta_groups:
          - Masar
      # Safety net for the buildBetaDetail 404 described at the top of this
      # file: it aborts the step above AFTER the binary has uploaded, leaving
      # the build sitting in App Store Connect assigned to no group -- which
      # looks exactly like "nothing happened" on the phone. Post-publish
      # scripts run even when publishing failed, so this re-attempts just the
      # group assignment, which needs no buildBetaDetail at all.
      #
      # A no-op when publishing worked: add-build on a build already in the
      # group changes nothing.
      scripts:
        - name: Ensure the build reached the Masar group
          script: |
            set -euo pipefail
            APP_ID=6795260984

            # Apple takes a while to make a fresh build queryable; the upload
            # itself already succeeded by this point, so it is worth waiting.
            BUILD_ID=""
            for attempt in $(seq 1 20); do
              BUILD_ID=$(app-store-connect builds list \
                --app-id "$APP_ID" \
                --build-version-number "$PROJECT_BUILD_NUMBER" \
                --json 2>/dev/null \
                | python3 -c 'import json,sys; b=json.load(sys.stdin); print(b[0]["id"] if b else "")' \
                || true)
              [ -n "$BUILD_ID" ] && break
              echo "build $PROJECT_BUILD_NUMBER not queryable yet (attempt $attempt/20)"
              sleep 30
            done

            if [ -z "$BUILD_ID" ]; then
              echo "Could not find build $PROJECT_BUILD_NUMBER; assign it to Masar by hand."
              exit 1
            fi

            for attempt in $(seq 1 10); do
              if app-store-connect beta-groups add-build "$BUILD_ID" --beta-group Masar; then
                echo "Build $PROJECT_BUILD_NUMBER is in the Masar group."
                exit 0
              fi
              echo "add-build failed (attempt $attempt/10); retrying"
              sleep 30
            done

            echo "Could not add build $BUILD_ID to Masar; assign it by hand in TestFlight."
            exit 1
