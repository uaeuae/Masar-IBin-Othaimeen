# العلماء الذين يضم التطبيق دروسهم. كل سلسلة تنتسب لعالم واحد
# (`scholar:` في ملف السلسلة؛ الافتراضي ibn-uthaymeen).
# عند إضافة عالم جديد: أضف مدخلًا هنا، ثم سلاسله بـ scholar الجديد،
# وأدوات مزامنة خاصة بمصادره (قناته/موقعه) في tools/ingest.
#
# status: active يعني أن دروسه منشورة، و coming_soon يعني أنه معلن في
# التطبيق بلا سلاسل بعد. لا يجوز أن تكون لعالم coming_soon سلسلة نشطة،
# ولا لعالم active ألا تكون له سلسلة — النشر يرفض الحالتين.
#
# initial_ar حرف الروندل، ومصدره الشهرة لا أول الاسم (العثيمين ← ع).
scholars:
  - slug: ibn-uthaymeen
    name_ar: الشيخ محمد بن صالح العثيمين
    initial_ar: ع
    accent: green
    honorific_ar: رحمه الله
    status: active
    foundation_ar: مؤسسة الشيخ محمد بن صالح العثيمين الخيرية
    website: https://binothaimeen.net
    youtube_url: https://www.youtube.com/@ibnothaimeentv
    sort_order: 1

  - slug: ibn-baz
    name_ar: الشيخ عبد العزيز بن عبد الله بن باز
    initial_ar: ب
    accent: blue
    honorific_ar: رحمه الله
    status: active
    foundation_ar: مؤسسة الشيخ عبد العزيز بن باز الخيرية
    website: https://binbaz.org.sa
    sort_order: 2
